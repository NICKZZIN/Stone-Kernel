name: 🪨 Stone Kernel Build

on:
  push:
    branches:
      - lineage-23.2
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Nome do defconfig (ex: vendor/stone_defconfig ou stone_defconfig)'
        required: true
        default: 'stone_defconfig'

env:
  ANYKERNEL_REPO: "https://github.com/mayuresh2543/AnyKernel3.git"
  ANYKERNEL_BRANCH: "stone"

jobs:
  build:
    name: Compilar Kernel
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Baixar o Código Fonte do Kernel
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: 📦 Instalar Dependências
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex \
          git gnupg gperf libelf-dev libncurses5-dev \
          libssl-dev python3 python-is-python3 zip \
          android-sdk-libsparse-utils \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi wget lz4 pigz rsync

    - name: 💾 Cache do Clang Toolchain
      id: cache-clang
      uses: actions/cache@v4
      with:
        path: ~/clang
        key: clang-r547379

    - name: 🛠️ Baixar AOSP Clang r547379
      if: steps.cache-clang.outputs.cache-hit != 'true'
      run: |
        mkdir -p $HOME/clang
        curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz" -o /tmp/clang.tar.gz
        tar -xzf /tmp/clang.tar.gz -C $HOME/clang
        rm /tmp/clang.tar.gz

    - name: 🔗 Adicionar Clang ao PATH
      run: echo "$HOME/clang/bin" >> $GITHUB_PATH

    - name: 💾 Cache do ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ github.sha }}
        restore-keys: |
          ccache-

    - name: ⚙️ Configurar ccache e Verificar Toolchain
      run: |
        ccache -M 5G
        ccache -o compression=true
        ccache -o compiler_check=content
        ccache -z
        echo "=== ccache config ==="
        ccache -p | grep -E "max_size|compression"
        echo "=== Clang version ==="
        clang --version || true
        echo "=== LLD version ==="
        ld.lld --version || true

    - name: 📥 Baixar AnyKernel3
      run: |
        git clone --depth=1 -b ${{ env.ANYKERNEL_BRANCH }} ${{ env.ANYKERNEL_REPO }} AnyKernel3

    - name: 🧵 Compilar Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Define os prefixos das ferramentas para ARM64 e ARM32 (dependências instaladas via apt)
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        # O segredo para o ccache funcionar: chamá-lo antes do clang
        export CC="ccache clang"
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export STRIP=llvm-strip
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export LLVM=1
        export LLVM_IAS=1
        
        DEFCONFIG="${{ github.event.inputs.defconfig || 'stone_defconfig' }}"
        
        echo "Gerando config com $DEFCONFIG..."
        make O=out $DEFCONFIG
        
        echo "Iniciando compilação usando $(nproc) threads..."
        make -j$(nproc --all) O=out

    - name: 📊 Exibir estatísticas do ccache
      run: ccache -s

    - name: 📦 Empacotar Flashable ZIP
      run: |
        if [ ! -f out/arch/arm64/boot/Image ]; then
          echo "❌ ERRO: Arquivo Image não encontrado! A compilação falhou."
          exit 1
        fi
        
        echo "✅ Kernel Image encontrado. Copiando para AnyKernel3..."
        cp out/arch/arm64/boot/Image AnyKernel3/
        
        # Define os caminhos baseados na lógica do seu script
        DTS_QCOM_DIR="out/arch/arm64/boot/dts/vendor/qcom"
        
        echo "🔍 Procurando o DTB específico do Sunstone..."
        # Tenta encontrar o sunstone.dtb ou qualquer DTB gerado naquela pasta
        if [ -f "$DTS_QCOM_DIR/sunstone.dtb" ]; then
          echo "✅ sunstone.dtb exato encontrado!"
          cp "$DTS_QCOM_DIR/sunstone.dtb" AnyKernel3/dtb
        elif [ -f "$DTS_QCOM_DIR/stone.dtb" ]; then
          echo "✅ stone.dtb encontrado!"
          cp "$DTS_QCOM_DIR/stone.dtb" AnyKernel3/dtb
        else
          echo "⚠️ DTB específico não encontrado por nome direto. Tentando buscar o primeiro .dtb da pasta..."
          FIRST_DTB=$(find $DTS_QCOM_DIR -name "*.dtb" | head -n 1)
          if [ ! -z "$FIRST_DTB" ]; then
            echo "✅ DTB encontrado: $FIRST_DTB"
            cp "$FIRST_DTB" AnyKernel3/dtb
          else
            echo "❌ ERRO: Nenhum arquivo .dtb foi gerado em $DTS_QCOM_DIR"
          fi
        fi
        
        echo "🔍 Procurando arquivo DTBO..."
        # O seu script mostrou que ele pode estar na raiz como dtbo.img
        if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
          echo "✅ dtbo.img encontrado na raiz de boot!"
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo
        elif [ -f "$DTS_QCOM_DIR/dtbo.img" ]; then
          echo "✅ dtbo.img encontrado na pasta qcom!"
          cp "$DTS_QCOM_DIR/dtbo.img" AnyKernel3/dtbo.img
          cp "$DTS_QCOM_DIR/dtbo.img" AnyKernel3/dtbo
        else
          echo "⚠️ Nenhum arquivo dtbo.img padrão encontrado. Buscando alternativos..."
          FIRST_DTBO=$(find out/arch/arm64/boot/ -name "*.dtbo" -o -name "dtbo.img" | head -n 1)
          if [ ! -z "$FIRST_DTBO" ]; then
            echo "✅ DTBO alternativo encontrado em: $FIRST_DTBO"
            cp "$FIRST_DTBO" AnyKernel3/dtbo.img
            cp "$FIRST_BO" AnyKernel3/dtbo || true
          fi
        fi
        
        # Mostra o que entrou no AnyKernel3 para você conferir no log do GitHub
        echo "=== Conteúdo final da pasta AnyKernel3 ==="
        ls -la AnyKernel3/
        
        cd AnyKernel3
        ZIP_NAME="Vertex-stone-crDroid-${{ github.run_id }}.zip"
        zip -r9 ../$ZIP_NAME * -x '*.git*' '*.md' '*.placeholder'
        echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

    - name: 🚀 Fazer Upload do ZIP
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ZIP_NAME }}
        path: ${{ env.ZIP_NAME }}
