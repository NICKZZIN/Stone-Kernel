name: Build Kernel

on:
  push:
    branches: [ lineage-23.2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            git gnupg gperf libelf-dev libncurses5-dev \
            libssl-dev python3 python-is-python3 zip \
            android-sdk-libsparse-utils \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
            
      - name: Cache Clang toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/clang
          key: clang-r547379

      - name: Install mkdtimg
        run: |
          git clone https://android.googlesource.com/platform/system/libufdt /tmp/libufdt
          sudo cp /tmp/libufdt/utils/src/mkdtboimg.py /usr/local/bin/mkdtimg
          sudo chmod +x /usr/local/bin/mkdtimg

      - name: Apply Droidspaces Patches
        run: |
          echo "=== Baixando patch necessário do Droidspaces ==="
          curl -LSs "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch" -o droidspace_kabi.patch
          
          echo "=== Aplicando Patch: KABI (6_7_8) ==="
          patch -p1 < droidspace_kabi.patch
          
          echo "=== NOTA: Patch MQUEUE ignorado pois o kernel já possui a estrutura nativa ==="
          
      
      - name: Inject KernelSU & SUSFS
        run: |
          # 1. Instalação do Wild_KSU a partir do Fork CYB3R
          echo "=== Instalando Wild_KSU (Fork: CYB3R) ==="
          curl -LSs "https://raw.githubusercontent.com/cyberc3dr/Wild_KSU/refs/heads/stable/kernel/setup.sh" | bash -s stable
          
          # 2. Aplicar o Patch do SUSFS para Kernel 5.4
          echo "=== Aplicando Patch SUSFS 5.4 ==="
          curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Patch/susfs_patch_to_5.4.patch" -o susfs.patch
          patch -p1 < susfs.patch || echo "⚠️ Alguns hunks do SUSFS falharam, aplicando correções manuais abaixo..."
          
          # 3. Aplicar Inline Hooks (Bypass)
          echo "=== Aplicando Inline Hooks ==="
          curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/susfs_inline_hook_patches.sh" | bash
          
          # 3.5 FIX: Remover chamada para função inexistente no SUSFS v1.5.3
          echo "=== Corrigindo incompatibilidade do SUSFS v1.5.3 ==="
          sed -i 's/susfs_run_sus_path_loop();/\/\/ susfs_run_sus_path_loop();/g' drivers/kernelsu/setuid_hook.c
          
          # 4. Fixes de compatibilidade da Xiaomi 5.4
          echo "=== Aplicando Fixes de compatibilidade (Xiaomi 5.4) ==="
          KSU_DIR="drivers/kernelsu"
          if [ -d "$KSU_DIR" ]; then
              find "$KSU_DIR" -type f -name "*.c" -exec sed -i 's/strncpy_from_unsafe_user/strncpy_from_user_nofault/g' {} +
              sed -i '1i #include <linux/uaccess.h>' "$KSU_DIR/ksu.c"
          fi

          # ===================================================================
          # GOD MODE FIXES: RESOLVENDO OS ERROS DE LINKER (vmlinux.o)
          # ===================================================================

          # FIX 1: Programando a 'path_umount' do zero para o Kernel 5.4
          echo "=== Injetando backport de path_umount no fs/namespace.c ==="
          
          # 1.1 Limpa a exportação fantasma da tentativa anterior
          sed -i '/EXPORT_SYMBOL(path_umount);/d' fs/namespace.c

          # 1.2 Injeta a função real no rodapé do fs/namespace.c
          echo "" >> fs/namespace.c
          cat << 'EOF' >> fs/namespace.c

          /* KSU/SUSFS BACKPORT: Ponte nativa de path_umount para Kernel 5.4 */
          int path_umount(struct path *path, int flags)
          {
              struct mount *mnt = real_mount(path->mnt);
              return do_umount(mnt, flags);
          }
          EXPORT_SYMBOL(path_umount);
          EOF

          # 1.3 Declara a função no cabeçalho global do KSU de forma blindada
          echo "struct path;" >> drivers/kernelsu/ksu.h
          echo "extern int path_umount(struct path *path, int flags);" >> drivers/kernelsu/ksu.h

          # FIX 2: Recriando as chaves fantasmas do KSU antigo para o SUSFS
          echo "=== Injetando chaves fantasmas do input e init_rc ==="
          cat << 'EOF' >> drivers/kernelsu/ksu.c

          /* SUSFS COMPATIBILITY: Chaves fantasmas para bypass de linker */
          #include <linux/jump_label.h>
          DEFINE_STATIC_KEY_FALSE(ksu_is_input_hook_enabled);
          EXPORT_SYMBOL(ksu_is_input_hook_enabled);
          DEFINE_STATIC_KEY_FALSE(ksu_is_init_rc_hook_enabled);
          EXPORT_SYMBOL(ksu_is_init_rc_hook_enabled);
          EOF

          # 5. Salvar alterações para o Build
          git config --global user.email "bot@github.com"
          git config --global user.name "GitHub Actions"
          git add .
          git commit -m "Integrate Wild_KSU + SUSFS + Linker Fixes" || true
          
      - name: Download AOSP Clang r547379
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/clang
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz" -o /tmp/clang.tar.gz
          tar -xzf /tmp/clang.tar.gz -C $HOME/clang
          rm /tmp/clang.tar.gz
      - name: Add Clang to PATH
        run: echo "$HOME/clang/bin" >> $GITHUB_PATH

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-
            
      - name: Configure ccache
        run: |
          ccache -M 5G
          ccache -o compression=true
          ccache -o compiler_check=content
          ccache -z
          echo "=== ccache config ==="
          ccache -p | grep -E "max_size|compression"
          
      - name: Verify toolchain
        run: |
          echo "=== Clang version ==="
          clang --version
          echo "=== LLD version ==="
          ld.lld --version || true
          echo "=== Tools ==="
          which clang ld.lld llvm-ar llvm-nm llvm-objcopy || true
          
      - name: Generate defconfig
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            stone_defconfig
            
      - name: Configure kernel options
        run: |
          # Enable options without modifying defconfig
          scripts/config --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_SUSFS \
            --enable CONFIG_COMPAT_VDSO \
            --enable CONFIG_SHADOW_CALL_STACK \
            --enable CONFIG_SHADOW_CALL_STACK_VMAP \
            --enable CONFIG_LTO_CLANG \
            --disable CONFIG_LTO_NONE \
            --disable CONFIG_CFI_CLANG \
            --enable CONFIG_RELR \
            --enable CONFIG_THINLTO
          # Resolve dependencies non-interactively
          make O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

      - name: Verify kernel config
        run: |
          echo "=== Checking critical configs ==="
          grep -E "CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_COMPAT_VDSO|CONFIG_SHADOW_CALL_STACK|CONFIG_SHADOW_CALL_STACK_VMAP|CONFIG_LTO_CLANG|CONFIG_LTO_NONE|CONFIG_CFI_CLANG|CONFIG_RELR|CONFIG_THINLTO" out/.config
          echo ""
          declare -A expected=(
            ["CONFIG_KSU"]=y
            ["CONFIG_KSU_SUSFS"]=y
            ["CONFIG_COMPAT_VDSO"]=y
            ["CONFIG_SHADOW_CALL_STACK"]=y
            ["CONFIG_SHADOW_CALL_STACK_VMAP"]=y
            ["CONFIG_LTO_CLANG"]=y
            ["CONFIG_RELR"]=y
            ["CONFIG_THINLTO"]=y
          )
          declare -A disabled=(
            ["CONFIG_CFI_CLANG"]=1
            ["CONFIG_LTO_NONE"]=1
          )
          for cfg in "${!expected[@]}"; do
            if grep -q "${cfg}=y" out/.config; then
              echo "✅ ${cfg} is enabled"
            else
              echo "❌ ${cfg} is NOT enabled!"
              exit 1
            fi
          done
          for cfg in "${!disabled[@]}"; do
            if grep -q "${cfg}=y" out/.config; then
              echo "❌ ${cfg} should be disabled but is enabled!"
              exit 1
            else
              echo "✅ ${cfg} is disabled"
            fi
          done
          
      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          echo "" > .scmversion
          make O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j$(nproc --all) \
            2>&1 | tee build.log
            
      - name: Print ccache stats
        if: always()
        run: ccache -s

      - name: Check build status
        run: |
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "❌ Kernel build failed! Image not found."
            echo ""
            echo "=== Last 100 lines of build log ==="
            tail -100 build.log
            exit 1
          fi
          echo "✅ Kernel built successfully!"
          
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-completo-${{ github.sha }}
          path: build.log
          retention-days: 7
          
      - name: Package with AnyKernel3
        run: |
          # 1. Baixar o AnyKernel3 correto
          git clone https://github.com/NICKZZIN/ANYKERNEL3-C137 AK3
          
          # 2. Copiar a Image principal para a raiz do AnyKernel
          cp out/arch/arm64/boot/Image AK3/
          
          # 3. Achar qualquer arquivo dtbo (seja .dtbo ou dtbo.img), remover o nome original e jogar na raiz principal como 'dtbo'
          find out/arch/arm64/boot/dts out/arch/arm64/boot -type f \( -name "*.dtbo" -o -name "dtbo.img" \) -exec cp {} AK3/dtbo \;
          
          # 4. Achar qualquer arquivo dtb, remover o nome original e jogar na raiz principal como 'dtb'
          find out/arch/arm64/boot/dts -type f -name "*.dtb" -exec cp {} AK3/dtb \;
          
          # 5. Limpar arquivos desnecessários do AnyKernel para o ZIP ficar limpo
          rm -rf AK3/.git AK3/README.md AK3/*placeholder
          
      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: C137-WKSU-SUSFS v1
          path: AK3/
          retention-days: 120
