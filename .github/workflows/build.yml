name: 🪨 Stone Kernel Build

# O workflow roda automaticamente quando você der push na branch lineage-23.2
# Ou pode ser disparado manualmente no painel "Actions" do GitHub
on:
  push:
    branches:
      - lineage-23.2
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Nome do defconfig (ex: vendor/stone_defconfig ou stone_defconfig)'
        required: true
        default: 'stone_defconfig'

env:
  ANYKERNEL_REPO: "https://github.com/mayuresh2543/AnyKernel3.git"
  ANYKERNEL_BRANCH: "stone"
  CLANG_REPO: "bachnxuan/aosp_clang_mirror"

jobs:
  build:
    name: Compilar Kernel
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Baixar o Código Fonte do Kernel
      uses: actions/checkout@v4

    - name: 📦 Instalar Dependências
      run: |
        sudo apt-get update
        sudo apt-get install -y git curl tar unzip make zip bc flex bison libssl-dev libelf-dev libncurses-dev rsync python3 lz4 pigz wget

    - name: 🛠️ Configurar Clang Toolchain
      run: |
        mkdir -p clang
        cd clang
        echo "Buscando última versão do Clang..."
        LATEST_URL=$(curl -s https://api.github.com/repos/${{ env.CLANG_REPO }}/releases/latest | grep "browser_download_url.*\.tar\.gz" | cut -d '"' -f 4)
        wget -q $LATEST_URL -O Clang.tar.gz
        tar -xf Clang.tar.gz
        rm -f Clang.tar.gz
        # Adiciona o Clang ao PATH do GitHub Actions
        echo "$(pwd)/bin" >> $GITHUB_PATH

    - name: 📥 Baixar AnyKernel3
      run: |
        git clone --depth=1 -b ${{ env.ANYKERNEL_BRANCH }} ${{ env.ANYKERNEL_REPO }} AnyKernel3

    - name: 🧵 Compilar Kernel
      run: |
        # Configura as variáveis de compilação
        export ARCH=arm64
        export SUBARCH=arm64
        export LLVM=1
        export LLVM_IAS=1
        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export STRIP=llvm-strip
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        # Pega o defconfig do input manual ou usa o padrão
        DEFCONFIG="${{ github.event.inputs.defconfig || 'stone_defconfig' }}"
        
        echo "Gerando config com $DEFCONFIG..."
        make O=out $DEFCONFIG
        
        echo "Iniciando compilação usando $(nproc) threads..."
        make -j$(nproc --all) O=out

    - name: 📦 Empacotar Flashable ZIP
      run: |
        # O GitHub Actions já cancela o script automaticamente se qualquer comando falhar,
        # mas adicionamos essa checagem dupla por segurança.
        if [ ! -f out/arch/arm64/boot/Image ]; then
          echo "❌ ERRO: Arquivo Image não encontrado! A compilação falhou."
          exit 1
        fi
        
        echo "✅ Kernel Image encontrado. Copiando para AnyKernel3..."
        cp out/arch/arm64/boot/Image AnyKernel3/
        
        # O SEGREDO DA TELA PRETA: Copiar os DTBs (se existirem)
        if [ -f out/arch/arm64/boot/dtb ]; then
          echo "✅ Arquivo DTB encontrado. Copiando..."
          cp out/arch/arm64/boot/dtb AnyKernel3/dtb
        fi
        
        if [ -f out/arch/arm64/boot/dtbo.img ]; then
          echo "✅ Arquivo DTBO encontrado. Copiando..."
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img
        fi
        
        cd AnyKernel3
        ZIP_NAME="Vertex-stone-crDroid-${{ github.run_id }}.zip"
        zip -r9 ../$ZIP_NAME * -x '*.git*' '*.md' '*.placeholder'
        echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

    - name: 🚀 Fazer Upload do ZIP
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ZIP_NAME }}
        path: ${{ env.ZIP_NAME }}
