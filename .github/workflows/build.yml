name: Build Kernel

on:
  push:
    branches: [ lineage-23.2-ksu ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            git gnupg gperf libelf-dev libncurses5-dev \
            libssl-dev python3 python-is-python3 zip \
            android-sdk-libsparse-utils \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Cache Clang toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/clang
          key: clang-r547379

      - name: Install mkdtimg
        run: |
          git clone https://android.googlesource.com/platform/system/libufdt /tmp/libufdt
          sudo cp /tmp/libufdt/utils/src/mkdtboimg.py /usr/local/bin/mkdtimg
          sudo chmod +x /usr/local/bin/mkdtimg
      
      - name: Inject KernelSU & Remove Dirty
        run: |
          # 1. Limpeza total
          sed -i '/KernelSU/d' fs/Kconfig fs/Makefile drivers/Kconfig drivers/Makefile Makefile || true
          rm -rf KernelSU drivers/KernelSU /tmp/ksu
          
          # 2. Clonar a versão do bittencourtjulival
          git clone https://github.com/NICKZZIN/Ksu-c137 /tmp/ksu
          cp -r /tmp/ksu/kernel drivers/KernelSU
          
          # 3. Integrar ao Makefile e Kconfig
          echo "obj-\$(CONFIG_KSU) += KernelSU/" >> drivers/Makefile
          sed -i '$i source "drivers/KernelSU/Kconfig"' drivers/Kconfig
          
          # 4. Correção do strncpy para Xiaomi
          sed -i 's/strncpy_from_unsafe_user/strncpy_from_user_nofault/g' drivers/KernelSU/kernel_compat.c || true
          
          # 5. "Cega" o Kprobes para forçar o uso dos Ganchos Manuais
          find drivers/KernelSU -type f -exec sed -i 's/CONFIG_KPROBES/CONFIG_KSU_BOGUS/g' {} +
          
          # 6. CIRURGIÃO PYTHON: INJETA OS GANCHOS MANUAIS (VFS HOOKS)
          cat << 'EOF' > patch_ksu.py
          import os

          def patch_file(filepath, search_str, insert_before="", insert_after=""):
              if not os.path.exists(filepath):
                  print(f"Arquivo não encontrado: {filepath}")
                  return
              with open(filepath, 'r') as f:
                  content = f.read()
              
              # Evita patchear duas vezes se a action rodar em cache
              if "ksu_handle_" in content and search_str in content:
                  print(f"Já patcheado: {filepath}")
                  return

              if search_str not in content:
                  print(f"ALERTA: Linha não encontrada em {filepath}")
                  return

              if insert_before:
                  content = content.replace(search_str, insert_before + "\n" + search_str)
              if insert_after:
                  content = content.replace(search_str, search_str + "\n" + insert_after)
                  
              with open(filepath, 'w') as f:
                  f.write(content)
              print(f"Patcheado com sucesso: {filepath}")

          # fs/exec.c
          patch_file('fs/exec.c', 
              'static int do_execveat_common(int fd, struct filename *filename,',
              insert_before='#ifdef CONFIG_KSU\nextern bool ksu_execveat_hook __read_mostly;\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\nextern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n#endif')
          
          patch_file('fs/exec.c',
              'return __do_execve_file(fd, filename, argv, envp, flags, NULL);',
              insert_before='\t#ifdef CONFIG_KSU\n\tif (unlikely(ksu_execveat_hook))\n\t\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n\telse\n\t\tksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);\n\t#endif')

          # fs/open.c
          patch_file('fs/open.c',
              'long do_faccessat(int dfd, const char __user *filename, int mode)',
              insert_before='#ifdef CONFIG_KSU\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif')
          
          patch_file('fs/open.c',
              'unsigned int lookup_flags = LOOKUP_FOLLOW;',
              insert_after='\t#ifdef CONFIG_KSU\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n\t#endif')

          # fs/read_write.c
          patch_file('fs/read_write.c',
              'ssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)',
              insert_before='#ifdef CONFIG_KSU\nextern bool ksu_vfs_read_hook __read_mostly;\nextern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\n#endif')
          
          patch_file('fs/read_write.c',
              'ssize_t ret;',
              insert_after='\t#ifdef CONFIG_KSU\n\tif (unlikely(ksu_vfs_read_hook))\n\t\tksu_handle_vfs_read(&file, &buf, &count, &pos);\n\t#endif')

          # fs/stat.c
          patch_file('fs/stat.c',
              'int vfs_statx(int dfd, const char __user *filename, int flags,',
              insert_before='#ifdef CONFIG_KSU\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n#endif')
          
          patch_file('fs/stat.c',
              'unsigned int lookup_flags = LOOKUP_FOLLOW | LOOKUP_AUTOMOUNT;',
              insert_after='\t#ifdef CONFIG_KSU\n\tksu_handle_stat(&dfd, &filename, &flags);\n\t#endif')

          # drivers/input/input.c (MODO DE SEGURANÇA)
          patch_file('drivers/input/input.c',
              'static void input_handle_event(struct input_dev *dev,',
              insert_before='#ifdef CONFIG_KSU\nextern bool ksu_input_hook __read_mostly;\nextern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n#endif')
          
          patch_file('drivers/input/input.c',
              'int disposition = input_get_disposition(dev, type, code, &value);',
              insert_after='\t#ifdef CONFIG_KSU\n\tif (unlikely(ksu_input_hook))\n\t\tksu_handle_input_handle_event(&type, &code, &value);\n\t#endif')

          # fs/devpts/inode.c (TERMINAL PM FIX)
          patch_file('fs/devpts/inode.c',
              'void *devpts_get_priv(struct dentry *dentry)',
              insert_before='#ifdef CONFIG_KSU\nextern int ksu_handle_devpts(struct inode*);\n#endif')
          
          patch_file('fs/devpts/inode.c',
              'if (dentry->d_sb->s_magic != DEVPTS_SUPER_MAGIC)',
              insert_before='\t#ifdef CONFIG_KSU\n\tksu_handle_devpts(dentry->d_inode);\n\t#endif')

          # fs/namespace.c (PATH_UMOUNT PARA MODULOS EM PRE-GKI)
          path_umount_code = """
          static int can_umount(const struct path *path, int flags)
          {
              struct mount *mnt = real_mount(path->mnt);
              if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
                  return -EINVAL;
              if (!may_mount()) return -EPERM;
              if (path->dentry != path->mnt->mnt_root) return -EINVAL;
              if (!check_mnt(mnt)) return -EINVAL;
              if (mnt->mnt.mnt_flags & MNT_LOCKED) return -EINVAL;
              if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN)) return -EPERM;
              return 0;
          }
          int path_umount(struct path *path, int flags)
          {
              struct mount *mnt = real_mount(path->mnt);
              int ret = can_umount(path, flags);
              if (!ret) ret = do_umount(mnt, flags);
              dput(path->dentry);
              mntput_no_expire(mnt);
              return ret;
          }
          """
          patch_file('fs/namespace.c', 
              '/*\n * Now umount can handle mount points as well as block devices.',
              insert_before=path_umount_code)

          EOF
          
          # Roda o script de injeção do KernelSU
          python3 patch_ksu.py
          
          # 7. MOD DE CARREGAMENTO RÁPIDO (5 AMPERES)
          echo "Injetando mod de bateria no smb5-lib.c..."
          find drivers/ -type f -name "smb5-lib.c" -exec sed -i 's/vote(chg->usb_icl_votable, SW_ICL_MAX_VOTER, false, 0);/vote(chg->usb_icl_votable, SW_ICL_MAX_VOTER, true, 5000000);/g' {} +
          
          # 8. Limpa o ambiente e Commita
          git config --global user.email "bot@github.com"
          git config --global user.name "GitHub Actions"
          git add .
          git commit -m "Injeção dinâmica do KernelSU e Mod de Fast Charge concluídos"
          
      - name: Download AOSP Clang r547379
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/clang
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz" -o /tmp/clang.tar.gz
          tar -xzf /tmp/clang.tar.gz -C $HOME/clang
          rm /tmp/clang.tar.gz

      - name: Add Clang to PATH
        run: echo "$HOME/clang/bin" >> $GITHUB_PATH

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Configure ccache
        run: |
          ccache -M 5G
          ccache -o compression=true
          ccache -o compiler_check=content
          ccache -z
          echo "=== ccache config ==="
          ccache -p | grep -E "max_size|compression"

      - name: Verify toolchain
        run: |
          echo "=== Clang version ==="
          clang --version
          echo "=== LLD version ==="
          ld.lld --version || true
          echo "=== Tools ==="
          which clang ld.lld llvm-ar llvm-nm llvm-objcopy || true

      - name: Generate defconfig
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            stone_defconfig

      - name: Configure kernel options
        run: |
          # Enable options without modifying defconfig
          scripts/config --file out/.config \
            --enable CONFIG_KSU \
            --enable CONFIG_COMPAT_VDSO \
            --enable CONFIG_SHADOW_CALL_STACK \
            --enable CONFIG_SHADOW_CALL_STACK_VMAP \
            --enable CONFIG_LTO_CLANG \
            --disable CONFIG_LTO_NONE \
            --disable CONFIG_CFI_CLANG \
            --enable CONFIG_RELR \
            --enable CONFIG_THINLTO

          # Resolve dependencies non-interactively
          make O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

      - name: Verify kernel config
        run: |
          echo "=== Checking critical configs ==="
          grep -E "CONFIG_COMPAT_VDSO|CONFIG_SHADOW_CALL_STACK|CONFIG_SHADOW_CALL_STACK_VMAP|CONFIG_LTO_CLANG|CONFIG_LTO_NONE|CONFIG_CFI_CLANG|CONFIG_RELR|CONFIG_THINLTO" out/.config
          echo ""
          declare -A expected=(
            ["CONFIG_KSU"]=y
            ["CONFIG_COMPAT_VDSO"]=y
            ["CONFIG_SHADOW_CALL_STACK"]=y
            ["CONFIG_SHADOW_CALL_STACK_VMAP"]=y
            ["CONFIG_LTO_CLANG"]=y
            ["CONFIG_RELR"]=y
            ["CONFIG_THINLTO"]=y
          )
          declare -A disabled=(
            ["CONFIG_CFI_CLANG"]=1
            ["CONFIG_LTO_NONE"]=1
          )
          for cfg in "${!expected[@]}"; do
            if grep -q "${cfg}=y" out/.config; then
              echo "✅ ${cfg} is enabled"
            else
              echo "❌ ${cfg} is NOT enabled!"
              exit 1
            fi
          done
          for cfg in "${!disabled[@]}"; do
            if grep -q "${cfg}=y" out/.config; then
              echo "❌ ${cfg} should be disabled but is enabled!"
              exit 1
            else
              echo "✅ ${cfg} is disabled"
            fi
          done

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          echo "" > .scmversion
          make O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j$(nproc --all) \
            2>&1 | tee build.log

      - name: Print ccache stats
        if: always()
        run: ccache -s

      - name: Check build status
        run: |
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "❌ Kernel build failed! Image not found."
            echo ""
            echo "=== Last 100 lines of build log ==="
            tail -100 build.log
            exit 1
          fi
          echo "✅ Kernel built successfully!"
          
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-completo-${{ github.sha }}
          path: build.log
          retention-days: 7
          
      - name: Package with AnyKernel3
        run: |
          # 1. Baixar o AnyKernel3 correto (SingkoLab) na branch 'stone'
          git clone https://github.com/NICKZZIN/ANYKERNEL3-C137.git AK3
          
          # 2. DELETAR qualquer pasta com o nome dtb ou dtbo que já venha no repositório do AK3
          # Isso obriga o sistema a criar ARQUIVOS soltos com esse nome, e não jogar dentro de pastas
          rm -rf AK3/dtb AK3/dtbo
          
          # 3. Copiar a Image principal para a raiz do AnyKernel
          cp out/arch/arm64/boot/Image AK3/
          
          # 4. Achar qualquer arquivo dtbo (seja .dtbo ou dtbo.img), remover o nome original e jogar na raiz principal como 'dtbo'
          find out/arch/arm64/boot/dts out/arch/arm64/boot -type f \( -name "*.dtbo" -o -name "dtbo.img" \) -exec cp {} AK3/dtbo \;
          
          # 5. Achar qualquer arquivo dtb, remover o nome original e jogar na raiz principal como 'dtb'
          find out/arch/arm64/boot/dts -type f -name "*.dtb" -exec cp {} AK3/dtb \;
          
          # 6. Limpar arquivos desnecessários do AnyKernel para o ZIP ficar limpo
          rm -rf AK3/.git AK3/README.md AK3/*placeholder

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-C137-KSU
          path: AK3/
          retention-days: 30
